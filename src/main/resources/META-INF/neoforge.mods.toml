description='''
Sacred Settlements adds protected, purchasable villages with an emerald-based economy.

Features:
- Configurable village protection (16-500 block radius)
- Purchase villages with emeralds
- Automated tax system with grace periods
- Owner-only building permissions
- Clean GUI with real-time stats
- Persistent data storage across restarts

Perfect for survival servers!
'''
